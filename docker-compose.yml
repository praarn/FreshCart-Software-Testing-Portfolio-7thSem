services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freshcart
      POSTGRES_PASSWORD: freshcart
      POSTGRES_DB: freshcart
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshcart"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./0-application/backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://freshcart:freshcart@postgres:5432/freshcart
      JWT_SECRET: freshcart-docker-secret-change-me
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./0-application/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
